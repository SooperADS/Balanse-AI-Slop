# Скопируйте в config.toml и задайте свой пароль.
[auth]
max_attempts = 5
password = ""

[server]
# Доступ с устройств домашней сети.
host = "0.0.0.0"
port = 8080
# Хост/IP с необязательным портом для приглашений, без http:// и пути.
# Например: "192.168.1.10:8080" или "budget.home:8080". Пусто — не создавать ссылки.
public_node = ""

[storage]
# Относительный путь отсчитывается от папки приложения.
database = "data/budget.sqlite3"
